<div id="app"></div>
<script>
"use strict";
var TOK = null, BEN = null;
try { TOK = localStorage.getItem("dsTok"); BEN = JSON.parse(localStorage.getItem("dsBen") || "null"); } catch (e) {}
var ROL_AD = { yonetici: "Yönetici", satis: "Satış", saha: "Keşif / kurulum", proje: "Proje", muhasebe: "Muhasebe", ortak: "İş ortağı" };
var ASAMA = ["Aday", "Nitelikli", "Keşif", "Teklif", "Sözleşme", "Kaybedildi"];
var KAYNAK = ["Eski teklif", "Teklifsiz aday", "Referans", "İş ortağı", "Instagram", "WhatsApp", "Site/toplu", "Diğer"];
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function bugun() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function tarih(s) { return s ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4) : ""; }
function sayi(v, d) { return new Intl.NumberFormat("tr-TR", { maximumFractionDigits: d || 0 }).format(v || 0); }
function telNorm(t) { t = String(t || "").replace(/\D/g, ""); if (t.indexOf("90") === 0 && t.length === 12) t = t.slice(2); if (t[0] === "0") t = t.slice(1); return t.length === 10 ? "0" + t : String(t || ""); }
function toast(m) { var e = document.createElement("div"); e.className = "toast"; e.textContent = m; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2600); }
function rol() { return BEN && BEN.rol; }
function yon() { return rol() === "yonetici"; }
// bölüm yetkileri: "" yok, "g" görür, "d" düzenler. Yönetici her şeyi düzenler; iş ortağı bölüm görmez.
var MODUL = [["musteri", "Müşteriler", "Adaylar, görüşmeler, arama planı"], ["teklif", "Teklifler", "Teklif hazırlama, PDF, katalog"], ["fiyat", "Fiyat ve maliyet", "Katalog fiyatları, kâr marjı, komisyonlar"], ["proje", "Projeler", "Kurulum takibi, keşif fotoğrafları"], ["fin", "Finans", "Kasa, bankalar, nakit akışı, çek, kredi"], ["odeme", "Ödemeler", "Ödeme listesi hazırlama, Excel yükleme"], ["ges", "GES", "Üretim, kira, inverterler, iş emirleri"], ["ortak", "Ortaklar ve sermaye", "Ortak cari, sermaye, varlıklar"], ["ekip", "Ekip yönetimi", "Kişi ekleme, yetki verme, şifre sıfırlama"]];
var SABLON = { satis: { musteri: "d", teklif: "d", proje: "d" }, saha: { musteri: "d", proje: "d", kendi: true }, proje: { musteri: "g", proje: "d" }, muhasebe: { teklif: "g", proje: "g", fin: "d", odeme: "d" }, yonetici: { musteri: "d", teklif: "d", fiyat: "d", proje: "d", fin: "d", odeme: "d", ges: "d", ortak: "d", ekip: "d" }, ortak: {} };
function yt(m, u) { u = u || BEN; if (!u) return ""; if (u.rol === "yonetici") return "d"; if (u.rol === "ortak") return ""; return u["y_" + m] || ""; }
function yd(m) { return yt(m) === "d"; }

function kendiF(p) { return BEN && BEN.kendi && rol() !== "yonetici" ? "(" + (p || "") + "sorumlu = " + q(BEN.id) + " || " + (p || "") + "kesifci = " + q(BEN.id) + ")" : ""; }
function sayfaMod(s, alt) {
  if (s === "adaylar" || s === "aday" || s === "yeni") return "musteri"; if (s === "teklifler" || s === "teklif" || s === "tpdf") return "teklif"; if (s === "katalog") return yt("fiyat") ? "fiyat" : "teklif";
  if (s === "projeler" || s === "proje") return "proje"; if (s === "ges" || s === "gesrapor" || s === "isemri") return "ges"; if (s === "ekip") return "ekip";
  if (s === "finans") return alt === "odeme" ? (yt("odeme") ? "odeme" : "fin") : alt === "ortak" || alt === "varlik" ? "ortak" : "fin"; return ""; }
function filtreQ(f) { return encodeURIComponent(f); }
function q(v) { return '"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'; }

var API_UCUS = {};
function api(yol, opt) {
  opt = opt || {};
  if ((opt.method || "GET") === "POST" && opt.body && !opt._tek) { var ak = yol + "|" + JSON.stringify(opt.body), on = API_UCUS[ak]; if (on && Date.now() - on.t < 3000) return on.p;
    var pr = api(yol, Object.assign({}, opt, { _tek: 1 })); API_UCUS[ak] = { t: Date.now(), p: pr }; setTimeout(function () { delete API_UCUS[ak]; }, 3000); return pr; } var h = { "Content-Type": "application/json" }; if (TOK) h.Authorization = TOK;
  return fetch(yol, { method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401) { cikis(); throw new Error("Oturum sona erdi"); }
      if (!r.ok) { var m = j && j.message || ("Hata " + r.status); var d = j && j.data ? Object.keys(j.data).map(function (k) { return k + ": " + (j.data[k].message || ""); }).join(", ") : ""; throw new Error(m + (d ? " (" + d + ")" : "")); }
      return j;
    });
  });
}
function liste(col, filtre, sirala, genis) {
  // 500'den fazla kayıt sayfa sayfa çekilir (müşteri, hareket listeleri büyüdükçe eksik kalmasın)
  var u = "/api/collections/" + col + "/records?perPage=500" + (filtre ? "&filter=" + filtreQ(filtre) : "") + (sirala ? "&sort=" + sirala : "") + (genis ? "&expand=" + genis : "");
  return api(u + "&page=1").then(function (j) { var L = j.items || [], top = j.totalPages || 1; if (top <= 1) return L;
    var is = []; for (var p = 2; p <= top; p++) is.push(api(u + "&page=" + p).then(function (k) { return k.items || []; }));
    return Promise.all(is).then(function (R) { R.forEach(function (x) { L = L.concat(x); }); return L; }); });
}
function hata(e) { toast(e.message || String(e)); }
function cikis() { TOK = null; BEN = null; try { localStorage.removeItem("dsTok"); localStorage.removeItem("dsBen"); } catch (e) {} location.hash = ""; ciz(); }

/* ---------- giriş ---------- */
function girisEkrani() {
  $("app").innerHTML = '<div class="giris"><div class="card"><h1>D Solar Satış</h1><p style="color:var(--muted);margin:0 0 14px">Ekip girişi</p>' +
    '<div style="display:grid;gap:10px"><label>E-posta<input id="gE" type="email" autocomplete="username" inputmode="email"></label><label>Şifre<input id="gS" type="password" autocomplete="current-password"></label>' +
    '<button class="btn pri" id="gB">Giriş yap</button><small id="gH" style="color:var(--bad)"></small></div></div></div>';
  var git = function () {
    $("gB").disabled = true;
    api("/api/collections/users/auth-with-password", { method: "POST", body: { identity: $("gE").value.trim(), password: $("gS").value } }).then(function (j) {
      TOK = j.token; BEN = j.record; try { localStorage.setItem("dsTok", TOK); localStorage.setItem("dsBen", JSON.stringify(BEN)); } catch (e) {}
      location.hash = rol() === "ortak" ? "#ortak" : "#bugun"; ciz();
    }).catch(function () { $("gH").textContent = "E-posta ya da şifre hatalı, ya da hesap kapalı."; $("gB").disabled = false; });
  };
  $("gB").onclick = git; $("gS").onkeydown = function (e) { if (e.key === "Enter") git(); };
}

/* ---------- iskelet ---------- */
function menu() {
  var M = [];
  if (rol() === "ortak") M = [["ortak", "🤝", "Müşterilerim"]];
  else {
    M.push(["bugun", "🏠", "Bugün"]);
    if (yt("musteri")) M.push(["adaylar", "👥", rol() === "saha" && BEN.kendi ? "Keşiflerim" : BEN.kendi && !yon() ? "Müşterilerim" : "Müşteriler"]);
    if (yd("musteri") && !yon() && rol() !== "saha") M.push(["yeni", "➕", "Yeni aday"]);
    if (yt("teklif")) M.push(["teklifler", "📄", "Teklifler"]);
    if (yt("proje")) M.push(["projeler", "🛠️", "Projeler"]);
    if (finansci()) M.push(["finans", "💰", "Finans"]);
    if (yt("ges")) M.push(["ges", "☀️", "GES"]);
    if (yt("ekip")) M.push(["ekip", "⚙️", "Ekip"]);
  }
  return M;
}
function ciz() {
  document.title = "D Solar";
  if (!TOK || !BEN) { girisEkrani(); return; }
  var h = (location.hash || "").replace(/^#/, "").split("/"), sayfa = h[0] || (rol() === "ortak" ? "ortak" : "bugun");
  $("app").innerHTML = '<header><b>D Solar</b><span class="rol">' + esc((BEN.name || BEN.email) + " · " + ROL_AD[rol()]) + '</span><a class="btn sm" href="#profil" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4);display:flex;align-items:center;text-decoration:none">Şifrem</a><button class="btn sm" id="cik" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Çıkış</button></header>' +
    '<nav>' + menu().map(function (m) { return '<a href="#' + m[0] + '" class="' + (m[0] === sayfa || (sayfa === "aday" && m[0] === "adaylar") ? "on" : "") + '"><i>' + (NAV_IK[m[0]] ? ikon(NAV_IK[m[0]][0], NAV_IK[m[0]][1], m[0] === sayfa || (sayfa === "aday" && m[0] === "adaylar") ? "dolu" : "") : m[1]) + "</i>" + m[2] + "</a>"; }).join("") + "</nav><main id=\"m\"><div class=\"bos\">Yükleniyor…</div></main>";
  $("cik").onclick = cikis;
  var sm = sayfaMod(sayfa, h[1]); document.body.classList.toggle("salt", !!sm && yt(sm) === "g");
  if (sm && yt(sm) === "g") { var mm = $("m"); if (mm) mm.insertAdjacentHTML("beforebegin", '<div class="saltB">Bu bölümde yalnız <b>görme</b> yetkiniz var; değişiklik yapılamaz.</div>'); }
  var S = { profil: sProfil, bugun: sBugun, adaylar: sAdaylar, aday: sAday, yeni: sYeni, teklifler: sTeklifler, ekip: sEkip, ortak: sOrtak, finans: sFinans, ges: sGes, teklif: sTeklif, tpdf: sTeklifPdf, projeler: sProjeler, katalog: sKatalog, gesrapor: sGesRapor, isemri: sIsEmri };
  (S[sayfa] || sBugun)(h[1]);
}
window.addEventListener("hashchange", ciz);

/* ---------- Ön hesap (ayarlar koleksiyonundaki "hesap" kaydıyla) ---------- */
function tlKwh(tl, H) { var e1 = H.k1Limit * H.k1; return tl <= e1 ? tl / H.k1 : H.k1Limit + (tl - e1) / H.k2; }
function onHesap(a, H) {
  if (!H) return null; var yil = 0, kaynak = "";
  if (a.yillikKwh > 0) { yil = a.yillikKwh; kaynak = "yıllık " + sayi(yil) + " kWh"; }
  else if (a.aylikFatura > 0) { yil = Math.round(tlKwh(a.aylikFatura, H) * 12); kaynak = "aylık " + sayi(a.aylikFatura) + " TL fatura (kademeli tarifeyle ~" + sayi(yil) + " kWh/yıl)"; }
  if (!yil) return null;
  var sozV = !(a.sozlesmeGucu > 0), soz = a.sozlesmeGucu > 0 ? a.sozlesmeGucu : H.varsayimSoz;
  var iht = yil / H.ozgulVerim, panel = Math.max(1, Math.ceil(iht * 1000 / H.panelW)), maxP = Math.floor(soz * H.dcAc * 1000 / H.panelW), sinirli = panel > maxP;
  if (sinirli) panel = maxP;
  var kwp = Math.round(panel * H.panelW / 10) / 100, kesif = iht < H.kesifAlt || kwp > H.kesifUst;
  var f = H.fiyatSabit + H.fiyatKwp * kwp, yuv = function (v) { return Math.round(v / 100) * 100; }, yuvTL = function (v) { return Math.round(v / 5000) * 5000; };
  var alt = yuv(f * (1 - H.aralik)), ust = yuv(f * (1 + H.aralik));
  return { yil: yil, kaynak: kaynak, soz: soz, sozV: sozV, sinirli: sinirli, panel: panel, kwp: kwp, kesif: kesif, fiyat: Math.round(f), alt: alt, ust: ust,
    tlAlt: yuvTL(alt * H.kur * (1 + H.kdv)), tlUst: yuvTL(ust * H.kur * (1 + H.kdv)), uretim: Math.round(kwp * H.ozgulVerim) };
}
function cevapMetni(a, O) { var ad = String(a.ad || "").split(" ")[0], bas = "Merhaba " + ad + ", " + (a.yillikKwh > 0 ? sayi(a.yillikKwh) + " kWh yıllık tüketiminize" : "aylık ~" + sayi(a.aylikFatura) + " TL faturanıza") + " göre ";
  if (O.kesif) return bas + "evinizin ihtiyacı standart paketlerimizin dışında görünüyor; doğru boyut ve fiyat için önce ücretsiz keşif yapalım. Uygun olduğunuz bir gün ve ilçenizi yazar mısınız? — D Solar Ekibi";
  return bas + "evinize yaklaşık " + sayi(O.kwp, 1) + " kWp (" + O.panel + " panel) bir sistem uygun görünüyor; bugünkü kurla yaklaşık " + sayi(O.tlAlt) + "–" + sayi(O.tlUst) + " TL (KDV dahil). Kesin boyut, elektrik aboneliğinizdeki sözleşme gücüne ve çatınıza bağlıdır. Faturanızın fotoğrafını gönderirseniz net teklifi 1 iş günü içinde hazırlayalım; keşif ücretsiz. — D Solar Ekibi"; }
function adayRow(a) {
  var alt = [a.ilce, a.kaynak, a.sonraki ? "sıradaki: " + tarih(a.sonraki) + (a.sonrakiIs ? " · " + a.sonrakiIs : "") : ""].filter(Boolean).join(" · ");
  var gec = a.sonraki && a.sonraki.slice(0, 10) < bugun() && a.asama !== "Sözleşme" && a.asama !== "Kaybedildi";
  return '<a class="row" href="#aday/' + a.id + '"><div class="t"><b>' + esc(a.ad) + "</b><small" + (gec ? ' style="color:var(--bad)"' : "") + ">" + esc(alt) + '</small></div><span class="pill p-' + esc(a.asama || "Aday") + '">' + esc(a.asama || "Aday") + "</span></a>";
}

/* ---------- Müşteriler ---------- */
/* ---------- Yeni aday (tekilleştirme kontrollü) ---------- */
function sYeni() {
  if (!satisci()) { location.hash = "#bugun"; return; }
  $("m").innerHTML = '<div class="card"><h3>Yeni aday</h3><div class="f">' +
    '<label>Ad soyad *<input id="yAd"></label><div class="f2"><label>Telefon<input id="yTel" inputmode="tel"></label><label>İlçe<input id="yIlce" list="ilceler"></label></div>' +
    '<datalist id="ilceler"><option>Urla<option>Çeşme<option>Seferihisar<option>Güzelbahçe<option>Narlıdere<option>Karaburun<option>Menderes<option>Foça</datalist>' +
    '<label>E-posta<input id="yEm" type="email"></label><div class="f2"><label>Kaynak<select id="yKay">' + KAYNAK.map(function (k) { return "<option>" + k + "</option>"; }).join("") + '</select></label>' +
    '<label>Aylık fatura (TL)<input id="yFat" inputmode="decimal"></label></div><label>Yıllık tüketim (kWh, faturada yazıyorsa)<input id="yKwh" inputmode="decimal"></label><div class="f2"><label>Sözleşme gücü (kW)<input id="ySoz" inputmode="decimal"></label><label>İYS izni<select id="yIys"><option>Sorulacak</option><option>İzinli</option><option>İzinsiz</option></select></label></div>' +
    '<div class="f2"><label>Sıradaki iş<input id="yIs" placeholder="ör. faturayı iste"></label><label>Tarih<input id="ySon" type="date" value="' + bugun() + '"></label></div>' +
    '<label>Not<textarea id="yNot"></textarea></label><div id="yUy"></div><button class="btn pri" id="yKay2">Kaydet</button></div></div>';
  var kaydet = function (zorla) {
    var ad = $("yAd").value.trim(), tel = telNorm($("yTel").value), em = $("yEm").value.trim().toLowerCase(), ilce = $("yIlce").value.trim();
    if (!ad) { toast("Ad gerekli"); return; }
    var kos = []; if (tel.length === 11) kos.push("tel ~ " + q(tel.slice(1))); if (em) kos.push("email = " + q(em)); if (ilce) kos.push("(ad = " + q(ad) + " && ilce = " + q(ilce) + ")");
    var kontrol = !zorla && kos.length ? liste("adaylar", kos.join(" || ")) : Promise.resolve([]);
    kontrol.then(function (V) {
      if (V.length) { $("yUy").innerHTML = '<div class="uyari" style="margin:0">Bu kişi zaten kayıtlı olabilir: ' + V.map(function (a) { return '<a href="#aday/' + a.id + '">' + esc(a.ad) + " (" + esc(a.asama || "") + ")</a>"; }).join(", ") +
        '. Aynı kişiyse mevcut kaydı açın; kaynak olarak yeni kanal not edilir. Farklı kişiyse <button class="btn sm" id="yZ">yine de kaydet</button></div>'; $("yZ").onclick = function () { kaydet(true); }; return; }
      var veri = { ad: ad, tel: tel, email: em, ilce: ilce, kaynak: $("yKay").value, asama: "Aday", iys: $("yIys").value, sorumlu: BEN.id, sonrakiIs: $("yIs").value.trim(), not: $("yNot").value.trim() };
      var fat = parseFloat(String($("yFat").value).replace(/\./g, "").replace(",", ".")); if (fat > 0) veri.aylikFatura = fat;
      var kwh = parseFloat(String($("yKwh").value).replace(/\./g, "").replace(",", ".")); if (kwh > 0) veri.yillikKwh = kwh;
      var sz = parseFloat(String($("ySoz").value).replace(",", ".")); if (sz > 0) veri.sozlesmeGucu = sz;
      if ($("ySon").value) veri.sonraki = $("ySon").value + " 09:00:00.000Z";
      return api("/api/collections/adaylar/records", { method: "POST", body: veri }).then(function (r) { toast("Aday eklendi"); location.hash = "#aday/" + r.id; });
    }).catch(hata);
  };
  $("yKay2").onclick = function () { kaydet(false); };
}

/* ---------- Aday kartı ---------- */
function sAday(id) {
  Promise.all([api("/api/collections/adaylar/records/" + id + "?expand=sorumlu,kesifci,ortak"),
    yt("musteri") || yt("proje") ? liste("gorusmeler", "aday = " + q(id), "-created", "yazan") : Promise.resolve([]),
    yt("teklif") ? liste("teklifler", "aday = " + q(id), "-created") : Promise.resolve([]),
    satisci() && !BEN.kendi ? liste("users", "aktif = true") : Promise.resolve([]),
    satisci() ? liste("ayarlar", "anahtar = 'hesap'") : Promise.resolve([]),
    liste("projeler", "aday = " + q(id)).catch(function () { return []; })]).then(function (R) {
    var PRJ = R[5][0], acT = R[2].filter(function (t) { return t.durum === "Anlaşıldı"; })[0];
    var a = R[0], G = R[1], T = R[2], U = R[3], x = a.expand || {}, H = R[4][0] && R[4][0].deger, O = satisci() ? onHesap(a, H) : null;
